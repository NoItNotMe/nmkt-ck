<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Minh họa sự sai lệch thông tin giữa các bộ phận qua câu chuyện chiếc xích đu">
  <rect width="960" height="600" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="920" height="560" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#0f172a">KHI MỖI BỘ PHẬN HIỂU MỘT KIỂU (CÂU CHUYỆN CHIẾC XÍCH ĐU)</text>

  <!-- Panel 1: Customer explained -->
  <rect x="44" y="78" width="276" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="44" y="266" width="276" height="44" rx="0" fill="#f1f5f9"/>
  <text x="182" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">1. Khách hàng mô tả</text>
  <!-- Tree -->
  <rect x="112" y="156" width="20" height="92" fill="#92400e"/>
  <path d="M 122 162 L 222 146" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="124" cy="128" r="34" fill="#86efac"/>
  <circle cx="164" cy="120" r="28" fill="#4ade80"/>
  <circle cx="94" cy="134" r="24" fill="#4ade80"/>
  <!-- 3-tier swing -->
  <line x1="176" y1="152" x2="176" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="214" y1="147" x2="214" y2="232" stroke="#475569" stroke-width="2"/>
  <rect x="170" y="182" width="50" height="6" rx="2" fill="#d97706"/>
  <rect x="170" y="206" width="50" height="6" rx="2" fill="#d97706"/>
  <rect x="170" y="230" width="50" height="6" rx="2" fill="#d97706"/>

  <!-- Panel 2: PM understood -->
  <rect x="342" y="78" width="276" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="342" y="266" width="276" height="44" fill="#f1f5f9"/>
  <text x="480" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">2. Quản lý dự án hiểu</text>
  <rect x="410" y="156" width="20" height="92" fill="#92400e"/>
  <path d="M 420 164 L 516 146" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 420 176 L 516 184" stroke="#92400e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="424" cy="126" r="32" fill="#86efac"/>
  <circle cx="464" cy="122" r="26" fill="#4ade80"/>
  <!-- Ropes hitting middle branch -->
  <line x1="478" y1="154" x2="478" y2="226" stroke="#475569" stroke-width="2"/>
  <line x1="508" y1="148" x2="508" y2="226" stroke="#475569" stroke-width="2"/>
  <rect x="472" y="224" width="42" height="7" rx="2" fill="#d97706"/>

  <!-- Panel 3: Analyst designed -->
  <rect x="640" y="78" width="276" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="640" y="266" width="276" height="44" fill="#f1f5f9"/>
  <text x="778" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">3. Kỹ sư thiết kế cắt thân cây</text>
  <!-- Split trunk with braces -->
  <rect x="720" y="206" width="20" height="42" fill="#92400e"/>
  <rect x="720" y="144" width="20" height="26" fill="#92400e"/>
  <rect x="694" y="156" width="8" height="74" fill="#64748b"/>
  <rect x="756" y="156" width="8" height="74" fill="#64748b"/>
  <path d="M 730 152 L 820 144" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="732" cy="124" r="30" fill="#86efac"/>
  <circle cx="770" cy="122" r="26" fill="#4ade80"/>
  <line x1="786" y1="148" x2="786" y2="224" stroke="#475569" stroke-width="2"/>
  <line x1="812" y1="145" x2="812" y2="224" stroke="#475569" stroke-width="2"/>
  <rect x="780" y="222" width="38" height="7" rx="2" fill="#d97706"/>

  <!-- Panel 4: Programmer built -->
  <rect x="44" y="330" width="276" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="44" y="518" width="276" height="44" fill="#f1f5f9"/>
  <text x="182" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">4. Bộ phận thi công lắp đặt</text>
  <rect x="116" y="408" width="20" height="92" fill="#92400e"/>
  <path d="M 126 414 L 222 398" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="130" cy="378" r="32" fill="#86efac"/>
  <circle cx="168" cy="374" r="26" fill="#4ade80"/>
  <!-- Tied right against trunk -->
  <line x1="138" y1="414" x2="112" y2="478" stroke="#475569" stroke-width="2"/>
  <line x1="148" y1="412" x2="138" y2="478" stroke="#475569" stroke-width="2"/>
  <rect x="106" y="476" width="38" height="7" rx="2" fill="#d97706"/>

  <!-- Panel 5: Sales pitch -->
  <rect x="342" y="330" width="276" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="342" y="518" width="276" height="44" fill="#f1f5f9"/>
  <text x="480" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">5. Tư vấn mô tả quá đà</text>
  <rect x="406" y="408" width="20" height="92" fill="#92400e"/>
  <path d="M 416 414 L 518 398" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="420" cy="378" r="32" fill="#86efac"/>
  <circle cx="464" cy="374" r="26" fill="#4ade80"/>
  <!-- Luxury armchair -->
  <line x1="472" y1="406" x2="472" y2="452" stroke="#475569" stroke-width="2"/>
  <line x1="512" y1="400" x2="512" y2="452" stroke="#475569" stroke-width="2"/>
  <rect x="466" y="448" width="52" height="32" rx="8" fill="#2563eb"/>
  <rect x="462" y="466" width="60" height="14" rx="5" fill="#1d4ed8"/>
  <polygon points="480,350 456,435 524,435" fill="#fde047" opacity="0.28"/>

  <!-- Panel 6: What customer actually needed -->
  <rect x="640" y="330" width="276" height="232" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="640" y="518" width="276" height="44" fill="#d1fae5"/>
  <text x="778" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#065f46">6. Thứ khách hàng thực sự cần</text>
  <rect x="712" y="408" width="20" height="92" fill="#92400e"/>
  <path d="M 722 414 L 820 398" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="726" cy="378" r="32" fill="#86efac"/>
  <circle cx="768" cy="374" r="26" fill="#4ade80"/>
  <!-- Simple tire swing -->
  <line x1="794" y1="404" x2="794" y2="454" stroke="#334155" stroke-width="2.5"/>
  <circle cx="794" cy="472" r="20" fill="none" stroke="#1e293b" stroke-width="9"/>
</svg>
