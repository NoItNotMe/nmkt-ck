<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Năm bước cơ bản của quá trình giao tiếp">
  <rect width="960" height="600" fill="#f8fafc" rx="16"/>
  <rect x="24" y="24" width="912" height="552" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <text x="480" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a">NĂM BƯỚC CƠ BẢN CỦA QUÁ TRÌNH GIAO TIẾP</text>
  <text x="480" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Chuỗi truyền tải thông điệp và vòng phản hồi hai chiều</text>

  <!-- Step 1 -->
  <rect x="52" y="160" width="152" height="176" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="128" cy="196" r="18" fill="#2563eb"/>
  <text x="128" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">1</text>
  <text x="128" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Người gửi</text>
  <text x="128" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">có ý tưởng</text>
  <text x="128" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Xác định thông tin</text>
  <text x="128" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">&amp; mục tiêu truyền đạt</text>

  <!-- Arrow 1->2 -->
  <path d="M 208 248 L 228 248" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="226,242 236,248 226,254" fill="#64748b"/>

  <!-- Step 2 -->
  <rect x="236" y="160" width="152" height="176" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="312" cy="196" r="18" fill="#0f172a"/>
  <text x="312" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">2</text>
  <text x="312" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Mã hóa</text>
  <text x="312" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">ý tưởng</text>
  <text x="312" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Lời nói, chữ viết,</text>
  <text x="312" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">bản vẽ hoặc ký hiệu</text>

  <!-- Arrow 2->3 -->
  <path d="M 392 248 L 412 248" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="410,242 420,248 410,254" fill="#64748b"/>

  <!-- Step 3 -->
  <rect x="420" y="160" width="152" height="176" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="496" cy="196" r="18" fill="#0f172a"/>
  <text x="496" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="496" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Truyền qua</text>
  <text x="496" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">các kênh</text>
  <text x="496" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Họp trực tiếp, email,</text>
  <text x="496" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">báo cáo, điện thoại</text>

  <!-- Arrow 3->4 -->
  <path d="M 576 248 L 596 248" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="594,242 604,248 594,254" fill="#64748b"/>

  <!-- Step 4 -->
  <rect x="604" y="160" width="152" height="176" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="680" cy="196" r="18" fill="#0f172a"/>
  <text x="680" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">4</text>
  <text x="680" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Người nhận</text>
  <text x="680" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">giải mã</text>
  <text x="680" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Tiếp nhận và hiểu</text>
  <text x="680" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">đúng nội dung kỹ thuật</text>

  <!-- Arrow 4->5 -->
  <path d="M 760 248 L 780 248" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="778,242 788,248 778,254" fill="#64748b"/>

  <!-- Step 5 -->
  <rect x="788" y="160" width="120" height="176" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <circle cx="848" cy="196" r="18" fill="#059669"/>
  <text x="848" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">5</text>
  <text x="848" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065f46">Phản hồi</text>
  <text x="848" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46">lại người gửi</text>
  <text x="848" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">Xác nhận &amp;</text>
  <text x="848" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">hồi đáp thêm</text>

  <!-- Feedback Loop Arc -->
  <path d="M 848 346 L 848 430 Q 848 450 828 450 L 148 450 Q 128 450 128 430 L 128 352" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5"/>
  <polygon points="122,356 128,342 134,356" fill="#059669"/>

  <rect x="290" y="424" width="380" height="50" rx="25" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="446" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">VÒNG PHẢN HỒI HAI CHIỀU (HỒI ĐÁP THÊM)</text>
  <text x="480" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#047857">Giải thích bổ sung · Đặt câu hỏi · Hiệu chỉnh đến khi thống nhất</text>

  <!-- Footer Note -->
  <rect x="52" y="502" width="856" height="44" rx="8" fill="#f1f5f9"/>
  <text x="480" y="529" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Thông điệp chỉ hoàn tất khi người nhận giải mã chính xác và phản hồi xác nhận cho người gửi.</text>
</svg>
